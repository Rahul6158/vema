{% extends 'layout.html' %}
{% block content %}
<div class="form-page-wrapper" style="max-width: 900px;">

  <!-- Page Header -->
  <div class="form-page-header">
    <div>
      <h1 class="form-page-title">{{ 'Edit Product Details' if product else 'Add Product to Inventory' }}</h1>
      <p class="form-page-subtitle">Specify appliance specifications, pricing margins, brand categorization, and stock quantity.</p>
    </div>
    <a href="{{ url_for('main.products') }}" class="btn-form-cancel">← Back to Products</a>
  </div>

  <form method="POST">
    <!-- SECTION 1: Product Identity -->
    <div class="form-page-card mb-3">
      <div class="form-section-header">
        <p class="form-section-title">📦 Product Identity</p>
      </div>
      <div class="form-section-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Product Name <span class="req">*</span></label>
            <input type="text" class="form-control" name="name"
                   value="{{ product.name if product else '' }}" required
                   placeholder="e.g. Inverter Air Conditioner 1.5 Ton">
          </div>
          <div class="col-md-3">
            <label class="form-label">Brand</label>
            <select class="form-select" name="brand_id">
              <option value="">-- Select Brand --</option>
              {% for b in brands %}
                <option value="{{ b.id }}" {% if product and product.brand_id == b.id %}selected{% endif %}>{{ b.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category_id">
              <option value="">-- Select Category --</option>
              {% for c in categories %}
                <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Model Code / Number</label>
            <input type="text" class="form-control font-mono" name="model"
                   value="{{ product.model if product else '' }}" placeholder="e.g. AR18CY3ANWK">
          </div>
          <div class="col-md-6">
            <label class="form-label">Initial Stock Level</label>
            <input type="number" class="form-control font-mono" name="stock"
                   value="{{ product.stock if product else '10' }}" min="0">
          </div>
        </div>
      </div>

      <hr class="form-section-divider">

      <!-- SECTION 2: Pricing -->
      <div class="form-section-header">
        <p class="form-section-title">💰 Pricing</p>
      </div>
      <div class="form-section-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Unit Purchase Price (₹)</label>
            <input type="number" step="0.01" class="form-control font-mono" name="purchase_price"
                   value="{{ product.purchase_price if product else '0.00' }}" min="0" placeholder="0.00">
          </div>
          <div class="col-md-6">
            <label class="form-label">Unit Selling Price (₹)</label>
            <input type="number" step="0.01" class="form-control font-mono" name="selling_price"
                   value="{{ product.selling_price if product else '0.00' }}" min="0" placeholder="0.00">
          </div>
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="form-action-bar form-page-card" style="border-radius: 16px;">
      <a href="{{ url_for('main.products') }}" class="btn-form-cancel">Cancel</a>
      <button type="submit" class="btn-form-primary">💾 Save Product</button>
    </div>
  </form>

</div>
{% endblock %}
