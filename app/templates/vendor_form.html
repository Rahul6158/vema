{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="mb-0 fw-bold">{% if vendor %}Edit Vendor Details{% else %}Register New Vendor{% endif %}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Vendor Name / Company <span class="text-danger">*</span></label>
                        <input type="text" name="vendor_name" class="form-control" placeholder="Enter vendor or company name" value="{{ vendor.vendor_name if vendor else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone No.</label>
                        <input type="text" name="phone" class="form-control" placeholder="Enter primary contact number" value="{{ vendor.phone if vendor else '' }}">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Town / City</label>
                            <input type="text" name="city" class="form-control" placeholder="Enter city" value="{{ vendor.city if vendor else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">State</label>
                            <input type="text" name="state" class="form-control" placeholder="Enter state" value="{{ vendor.state if vendor else '' }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('main.vendors') }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary">{% if vendor %}Save Changes{% else %}Register Vendor{% endif %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
