{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="page-title mb-1">Change Password</h1>
        <p class="text-muted small mb-0">Update your account login password to keep your CRM account secure.</p>
    </div>
    <div>
        <a href="/profile" class="btn btn-secondary">← Back to Profile</a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <span class="card-title-text">Password Security</span>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Current Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" name="old_password" required placeholder="Enter current password">
                        </div>

                        <div class="col-12">
                            <label class="form-label">New Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" name="new_password" required placeholder="Enter new strong password">
                        </div>

                        <div class="col-12 mt-4 pt-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Update Password</button>
                            <a href="/profile" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
