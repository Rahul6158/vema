{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Forgot Password</h5>
        <p>Enter your email address and we will send password reset instructions if your account exists.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <button class="btn btn-primary">Send Instructions</button>
        </form>
        <div class="mt-3">
          <a href="/login">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
