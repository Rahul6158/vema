<!-- ============ Shared Chart Enlarge Modal (blurred backdrop) ============ -->
<div class="modal fade" id="chartEnlargeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content" style="border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
      <div class="modal-header bg-light" style="border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem;">
        <div class="d-flex align-items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          <h5 class="modal-title fw-bold text-dark mb-0" id="chartEnlargeTitle" style="font-size: 1.05rem;">Chart</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4" style="background-color: #ffffff;">
        
        <!-- Standard Full-Width Chart Layout (Bar / Line / Trend) -->
        <div id="chartEnlargeStandardWrapper" style="position: relative; height: 70vh; width: 100%;">
          <canvas id="chartEnlargeCanvas"></canvas>
        </div>

        <!-- Compound Layout (Doughnut / Custom Legend / Center Overlay) -->
        <div id="chartEnlargeCompoundWrapper" class="d-none">
          <div class="row align-items-center g-4">
            <div id="chartEnlargeDonutCol" class="col-lg-6 d-flex justify-content-center align-items-center">
              <div id="chartEnlargeDonutContainer" style="width: 320px; height: 320px; position: relative;">
                <canvas id="chartEnlargeCanvasCompound"></canvas>
                <div id="chartEnlargeCenterOverlay" class="position-absolute top-50 start-50 translate-middle text-center pointer-events-none d-none">
                  <!-- Cloned Center Overlay -->
                </div>
              </div>
            </div>
            <div id="chartEnlargeLegendCol" class="col-lg-6 d-none">
              <div class="p-3.5 rounded-3" style="background-color: #f8fafc; border: 1px solid #e2e8f0; max-height: 65vh; overflow-y: auto;">
                <h6 class="fw-bold text-secondary mb-3" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Breakdown & Legend</h6>
                <div id="chartEnlargeLegendContainer">
                  <!-- Cloned Legend Rows -->
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
window._chartEnlargeTitles = window._chartEnlargeTitles || {};

function setupChartEnlarge(sourceId, title) {
  window._chartEnlargeTitles[sourceId] = title;
  const btns = document.querySelectorAll('[data-enlarge="' + sourceId + '"]');
  btns.forEach(function(btn) {
    btn.setAttribute('data-chart-title', title);
  });
}

(function() {
  let enlargedChartInstance = null;

  function destroyEnlargedInstance() {
    if (enlargedChartInstance) {
      enlargedChartInstance.destroy();
      enlargedChartInstance = null;
    }
    const canvasStd = document.getElementById('chartEnlargeCanvas');
    if (canvasStd && Chart.getChart(canvasStd)) {
      Chart.getChart(canvasStd).destroy();
    }
    const canvasCmp = document.getElementById('chartEnlargeCanvasCompound');
    if (canvasCmp && Chart.getChart(canvasCmp)) {
      Chart.getChart(canvasCmp).destroy();
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    const modalEl = document.getElementById('chartEnlargeModal');
    const titleEl = document.getElementById('chartEnlargeTitle');
    const stdWrapper = document.getElementById('chartEnlargeStandardWrapper');
    const cmpWrapper = document.getElementById('chartEnlargeCompoundWrapper');
    const stdCanvas = document.getElementById('chartEnlargeCanvas');
    const cmpCanvas = document.getElementById('chartEnlargeCanvasCompound');
    const overlayBox = document.getElementById('chartEnlargeCenterOverlay');
    const legendBox = document.getElementById('chartEnlargeLegendContainer');
    const legendCol = document.getElementById('chartEnlargeLegendCol');

    if (!modalEl || !stdCanvas || !cmpCanvas) return;

    modalEl.addEventListener('shown.bs.modal', function (event) {
      destroyEnlargedInstance();

      const btn = event.relatedTarget ? event.relatedTarget.closest('[data-enlarge]') : null;
      if (!btn) return;

      const sourceId = btn.getAttribute('data-enlarge');
      if (!sourceId) return;

      const srcCanvas = document.getElementById(sourceId);
      const srcChart = Chart.getChart(sourceId);
      if (!srcChart || !srcCanvas) return;

      const title = btn.getAttribute('data-chart-title') || 
                    (window._chartEnlargeTitles && window._chartEnlargeTitles[sourceId]) || 
                    'Chart';
      if (titleEl) {
        titleEl.textContent = title;
      }

      // Check if source card contains center overlay or custom legend
      const cardBody = srcCanvas.closest('.card-body');
      let centerOverlayEl = cardBody ? cardBody.querySelector('.translate-middle, .vendor-donut-center') : null;
      let legendCandidate = cardBody ? cardBody.querySelector('.vendor-name-text, .vendor-legend-row') : null;
      let legendEl = legendCandidate ? (legendCandidate.closest('.d-flex.flex-column') || legendCandidate.closest('.col-md-6')) : null;

      const isCompound = (srcChart.config.type === 'doughnut' || srcChart.config.type === 'pie') && (centerOverlayEl || legendEl);

      const clonedOptions = Object.assign({}, srcChart.config.options || {}, {
        responsive: true,
        maintainAspectRatio: false
      });

      if (isCompound) {
        stdWrapper.classList.add('d-none');
        cmpWrapper.classList.remove('d-none');

        // Setup center overlay if present
        if (centerOverlayEl && overlayBox) {
          overlayBox.innerHTML = centerOverlayEl.innerHTML;
          overlayBox.classList.remove('d-none');
          const mainVal = overlayBox.querySelector('.fw-bold, .amount');
          if (mainVal) {
            mainVal.style.fontSize = '1.35rem';
            mainVal.style.fontWeight = '800';
            mainVal.style.color = '#0f172a';
          }
          const subCaption = overlayBox.querySelector('.text-muted, .caption');
          if (subCaption) {
            subCaption.style.fontSize = '0.78rem';
            subCaption.style.fontWeight = '700';
            subCaption.style.color = '#64748b';
            subCaption.style.marginTop = '2px';
          }
        } else if (overlayBox) {
          overlayBox.classList.add('d-none');
        }

        // Setup legend if present
        if (legendEl && legendBox && legendCol) {
          legendBox.innerHTML = legendEl.innerHTML;
          legendCol.classList.remove('d-none');
          const rows = legendBox.querySelectorAll('.d-flex.align-items-center.justify-content-between, .vendor-legend-row');
          rows.forEach(row => {
            row.style.padding = '8px 12px';
            row.style.marginBottom = '6px';
            row.style.backgroundColor = '#ffffff';
            row.style.border = '1px solid #e2e8f0';
            row.style.borderRadius = '8px';
            row.style.fontSize = '0.88rem';
          });
        } else if (legendCol) {
          legendCol.classList.add('d-none');
        }

        enlargedChartInstance = new Chart(cmpCanvas, {
          type: srcChart.config.type,
          data: srcChart.config.data,
          options: clonedOptions
        });

      } else {
        cmpWrapper.classList.add('d-none');
        stdWrapper.classList.remove('d-none');

        enlargedChartInstance = new Chart(stdCanvas, {
          type: srcChart.config.type,
          data: srcChart.config.data,
          options: clonedOptions
        });
      }
    });

    modalEl.addEventListener('hidden.bs.modal', function () {
      destroyEnlargedInstance();
      if (overlayBox) {
        overlayBox.innerHTML = '';
        overlayBox.classList.add('d-none');
      }
      if (legendBox) {
        legendBox.innerHTML = '';
      }
      if (legendCol) {
        legendCol.classList.add('d-none');
      }
      cmpWrapper.classList.add('d-none');
      stdWrapper.classList.remove('d-none');
    });
  });
})();
</script>
